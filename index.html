<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6d5dfc">
<title>PocketPal – Daily Expense Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f1f2fb;--fg:#161a2b;--mut:#737a93;--bd:#e4e6f2;--card:#fff;--pri:#6d5dfc;--pri2:#a855f7;--red:#ef4444;--grn:#10b981;--sh:0 8px 30px rgba(60,60,120,.09)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0e16;--fg:#eef0f8;--mut:#8f96ad;--bd:#242838;--card:#151826;--sh:0 8px 30px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0c0e16;--fg:#eef0f8;--mut:#8f96ad;--bd:#242838;--card:#151826;--sh:0 8px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.45;min-height:100vh}
.wrap{max-width:1440px;margin:0 auto;padding:16px 16px 110px;display:grid;gap:16px}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes slide{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(-30px,20px)}}
.wrap>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.wrap>*:nth-child(2){animation-delay:.06s}.wrap>*:nth-child(3){animation-delay:.12s}.wrap>*:nth-child(4){animation-delay:.18s}.wrap>*:nth-child(5){animation-delay:.24s}.wrap>*:nth-child(6){animation-delay:.3s}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
.top h1 span{display:inline-block;animation:float 3s ease-in-out infinite}
select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;width:100%;outline:none;transition:.2s}
select:focus,input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(109,93,252,.18)}
.top select{width:auto;padding:7px 10px}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:22px;color:#fff;background:linear-gradient(135deg,#4338ca,#6d5dfc);box-shadow:0 14px 40px rgba(67,56,202,.3)}.hero>*{position:relative;z-index:1}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(30px);opacity:.45;z-index:0;animation:drift 9s ease-in-out infinite}.hero:before{width:190px;height:190px;background:#a78bfa;top:-60px;right:-40px}.hero:after{width:150px;height:150px;background:#22d3ee;bottom:-60px;left:30%;animation-delay:-4s}
.pb{height:8px;background:rgba(255,255,255,.22);border-radius:99px;margin-top:16px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}.pt{font-size:12px;opacity:.9;margin-top:6px}
.hero small{opacity:.85}
.hero .bal{font-size:40px;font-weight:800;letter-spacing:-1px;margin:2px 0 14px}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border-radius:14px;padding:9px 14px;flex:1;min-width:130px}
.chip b{display:block;font-size:17px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.card h2{margin:0 0 12px;font-size:15px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.nav b{font-size:17px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:18px;cursor:pointer;transition:.2s}
.ib:hover{background:var(--pri);color:#fff;transform:scale(1.08)}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.three div{background:var(--bg);border-radius:14px;padding:10px;text-align:center}
.three small{color:var(--mut);display:block}
.three b{font-size:15px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g2>.card:first-child{grid-column:1/-1}
@media(min-width:1000px){.wrap{grid-template-columns:1fr 1fr;padding:24px 32px 110px;gap:20px}.wrap>.top,.wrap>.g2,.wrap>:nth-child(7){grid-column:1/-1}.g2{grid-template-columns:2fr 1fr}.g2>.card:first-child{grid-column:auto}.wrap>:nth-child(3){display:flex;flex-direction:column;justify-content:center}.hero .bal{font-size:48px}}
@media(max-width:720px){.g2{grid-template-columns:1fr}.hero .bal{font-size:34px}}
.bars{display:flex;gap:6px;align-items:flex-end;height:185px;overflow-x:auto;position:relative;padding-bottom:6px;scroll-behavior:smooth}
.col{flex:1;min-width:48px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;height:100%;justify-content:flex-end}
.pair{display:flex;gap:3px;align-items:flex-end;height:130px}
.b{display:block;width:13px;border-radius:7px 7px 3px 3px;height:0;transition:height .9s cubic-bezier(.2,.8,.2,1)}
.b.g{background:linear-gradient(var(--grn),#34d399)}.b.r{background:linear-gradient(var(--pri2),var(--pri))}
.col span{font-size:11px;color:var(--mut)}
.col.sel span{color:var(--pri);font-weight:700}
.col.sel .pair{filter:drop-shadow(0 4px 8px rgba(109,93,252,.45))}
.leg{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px}
.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:center}
.donut svg{width:150px;height:150px;transform:rotate(-90deg)}
.donut circle{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.dc{position:absolute;text-align:center}
.dw{position:relative;display:grid;place-items:center}
.dc small{color:var(--mut);display:block;font-size:11px}
.lg{flex:1;min-width:150px;font-size:13px}
.lg div{display:flex;justify-content:space-between;gap:8px;padding:4px 0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mut);font-weight:600;text-align:right;padding:6px}th:first-child,td:first-child{text-align:left}
td{padding:9px 6px;border-top:1px solid var(--bd);text-align:right;cursor:pointer;transition:.2s}
tr:hover td{background:var(--bg)}tr.sel td{color:var(--pri);font-weight:700}
.pos{color:var(--grn)}.neg{color:var(--red)}
.it{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd);animation:slide .4s both}
.it:first-child{border:0}
.ic{width:42px;height:42px;border-radius:14px;background:var(--bg);display:grid;place-items:center;font-size:20px}
.it .m{flex:1;min-width:0}.it .m small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:16px;padding:6px;border-radius:8px}.x:hover{color:var(--red);background:var(--bg)}
.empty{text-align:center;color:var(--mut);padding:22px 0}.empty span{display:block;font-size:34px;animation:float 3s infinite}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.tools button,.rl{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:9px 13px;border-radius:12px;cursor:pointer;font:inherit;font-size:13px;transition:.2s}
.tools button:hover,.rl:hover{border-color:var(--pri);color:var(--pri);transform:translateY(-2px)}
.addbar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:flex;gap:10px;justify-content:center;z-index:20;box-shadow:0 -8px 30px rgba(0,0,0,.08)}.addbar button{flex:1;max-width:260px;border:0;border-radius:14px;padding:15px 8px;color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:.2s}.addbar button:active{transform:scale(.96)}.addbar .ae{background:#ef4444}.addbar .ai{background:#10b981}
.ov{position:fixed;inset:0;background:rgba(10,12,25,.55);opacity:0;pointer-events:none;transition:.3s;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.ov.on{opacity:1;pointer-events:auto}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);display:grid;gap:12px}
.ov.on .sheet{transform:none}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:14px;padding:4px}
.seg button{border:0;background:transparent;color:var(--mut);padding:10px;border-radius:11px;font:inherit;font-weight:700;cursor:pointer;transition:.25s}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 2px 10px rgba(0,0,0,.12)}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cats button{border:1px solid var(--bd);background:var(--bg);color:var(--fg);border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;transition:.2s}
.cats button.on{background:var(--pri);color:#fff;border-color:var(--pri);transform:scale(1.06)}
.amt{font-size:28px;font-weight:800;text-align:center}
.save{border:0;border-radius:14px;padding:14px;color:#fff;font:inherit;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(135deg,var(--pri),var(--pri2))}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:.35s;z-index:40;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.addbar .mic{flex:0 0 58px;max-width:58px;height:58px;border-radius:50%;padding:0;align-self:center;font-size:24px;background:linear-gradient(135deg,#6d5dfc,#a855f7);box-shadow:0 6px 18px rgba(109,93,252,.45)}
.addbar .mic.live{animation:pulse 1s infinite;background:#ef4444}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 18px rgba(239,68,68,0)}}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;font-size:14px}
.row input[type=checkbox]{width:22px;height:22px;padding:0}.row input[type=time],.row select{width:auto;padding:7px 10px}
.rem{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-160%);width:calc(100% - 24px);max-width:480px;background:var(--card);color:var(--fg);border:1px solid var(--pri);box-shadow:var(--sh);border-radius:18px;padding:14px;z-index:50;transition:transform .45s cubic-bezier(.2,.8,.2,1);display:grid;gap:10px}
.rem.on{transform:translate(-50%,0)}.rem b{font-size:15px}.rem small{color:var(--mut)}
.rem div{display:flex;gap:8px}.rem button{flex:1;border:0;border-radius:12px;padding:10px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--pri)}.rem button.g{background:var(--bg);color:var(--fg);flex:0 0 44px}
html,body{max-width:100%;overflow-x:hidden}.wrap>*,.g2>*,.top h1{min-width:0}
@media(max-width:999px){.wrap{grid-template-columns:minmax(0,1fr)}}
@media(max-width:720px){.g2{grid-template-columns:minmax(0,1fr)}.addbar{gap:6px;padding-left:8px;padding-right:8px}.addbar .ae,.addbar .ai{min-width:0;font-size:13px;padding-left:6px;padding-right:6px;overflow-wrap:anywhere}.tools button,.rl{flex:1 1 auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1><span>👛</span><div>PocketPal<small style="display:block;font-size:11px;font-weight:400;color:var(--mut)">Know where your money goes</small></div></h1><select id="cur"><option>₹</option><option>$</option><option>€</option><option>£</option></select></div>

  <div class="hero">
    <small>Total balance</small>
    <div class="bal" id="bal">0</div>
    <div class="chips">
      <div class="chip"><small>⬆ Income</small><b id="tinc">0</b></div>
      <div class="chip"><small>⬇ Spent</small><b id="texp">0</b></div>
    </div>
    <div class="pb"><i id="pbf"></i></div><div class="pt" id="pt"></div>
  </div>

  <div class="card">
    <div class="nav"><button class="ib" id="prev">‹</button><b id="mlabel"></b><button class="ib" id="next">›</button></div>
    <div class="three"><div><small>Income</small><b id="mi" class="pos">0</b></div><div><small>Spent</small><b id="me" class="neg">0</b></div><div><small>Saved</small><b id="ms">0</b></div></div>
  </div>

  <div class="g2">
    <div class="card"><h2>All months <small style="color:var(--mut);font-weight:400">(swipe sideways, tap a bar)</small></h2><div class="bars" id="bars"></div>
      <div class="leg"><span><i style="background:var(--grn)"></i>Income</span><span><i style="background:var(--pri)"></i>Spent</span></div></div>
    <div class="card"><h2>Where the money went</h2><div class="donut" id="donut"></div></div>
  </div>

  <div class="card"><h2>Month by month</h2><div style="overflow-x:auto"><table><thead><tr><th>Month</th><th>Income</th><th>Spent</th><th>Saved</th></tr></thead><tbody id="tb"></tbody></table></div></div>

  <div class="card"><h2 id="lt">Transactions</h2><div id="list"></div></div>

  <div class="card"><h2>🔔 Reminders &amp; voice</h2>
  <label class="row"><span>Daily reminders</span><input type="checkbox" id="ron"></label>
  <label class="row"><span>Reminder 1</span><input type="time" id="t1"></label>
  <label class="row"><span>Reminder 2</span><input type="time" id="t2"></label>
  <label class="row"><span>Language / ભાષા</span><select id="vl"><option value="gu-IN">ગુજરાતી</option><option value="hi-IN">हिन्दी</option><option value="en-IN">English</option><option value="mr-IN">मराठी</option><option value="bn-IN">বাংলা</option><option value="ta-IN">தமிழ்</option><option value="te-IN">తెలుగు</option><option value="kn-IN">ಕನ್ನಡ</option><option value="ml-IN">മലയാളം</option><option value="pa-IN">ਪੰਜਾਬੀ</option><option value="ur-IN">اردو</option></select></label>
  <div class="tools" style="margin:8px 0"><button id="rn">🔔 Allow notifications</button><button id="rt">▶ Test reminder</button><button id="ck">🧪 Check my phone</button></div><div id="ckr" style="font-size:13px;line-height:1.8;margin-bottom:8px"></div>
  <small id="rh" style="color:var(--mut)"></small></div>
  <div class="card"><h2>Your data</h2><div class="tools"><button id="bk">⬇ Backup</button><label class="rl">⬆ Restore<input id="rs" type="file" accept=".json,application/json" hidden></label><button id="xl">📊 Export to Excel</button></div>
    <small id="dh" style="color:var(--mut);display:block;margin-top:10px"></small></div>
</div>

<div class="addbar"><button class="ae" id="addE">💸 I spent money</button><button class="mic" id="mic" aria-label="Speak an expense">🎤</button><button class="ai" id="addI">💰 I received money</button></div>
<div class="ov" id="ov"><div class="sheet">
  <div class="seg"><button id="te" class="on">Expense</button><button id="ti">Income</button></div>
  <input class="amt" id="amt" type="number" inputmode="decimal" min="0" placeholder="Enter amount">
  <div class="cats" id="cats"></div>
  <input id="note" placeholder="Note (optional)">
  <input id="date" type="date">
  <button class="save" id="save">Save</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="rem" id="rem"><b>⏰ Expense reminder</b><small id="remt"></small><div><button id="rv">🎤 Speak</button><button id="ra">✍ Add</button><button class="g" id="rx" aria-label="Dismiss">✕</button></div></div>

<script>
var $=function(i){return document.getElementById(i)};
var KEY="hisab-entries-v1",CK="hisab-currency";
var EXPC={Food:"🍔",Nasta:"🥪",Chai:"☕",Jaman:"🍛",Travel:"🚗",Home:"🏠",Bills:"💡",Shopping:"🛍️",Health:"💊",Fun:"🎬",Other:"📌"};
var INCC={Salary:"💼",Business:"🏪",Gift:"🎁",Other:"💰"};
var COL=["#6d5dfc","#a855f7","#ec4899","#f59e0b","#10b981","#06b6d4","#3b82f6","#94a3b8","#f97316","#14b8a6","#eab308","#64748b"];
var data=[],type="exp",cat="Food",sym="₹",sel;
function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lset(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function shift(m,n){var p=m.split("-"),d=new Date(+p[0],+p[1]-1+n,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")}
function mlab(m,s){var p=m.split("-");return new Date(+p[0],+p[1]-1,1).toLocaleString(R&&R.lang||"en-US",s?{month:"short"}:{month:"long",year:"numeric"})}
function fmt(n){return (n<0?"-":"")+sym+Math.abs(Math.round(n)).toLocaleString(sym=="₹"?"en-IN":"en-US")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function anim(el,to){var from=el._v||0;el._v=to;var t0=performance.now();(function f(t){var p=Math.min(1,(t-t0)/700),e=1-Math.pow(1-p,3);el.textContent=fmt(from+(to-from)*e);if(p<1)requestAnimationFrame(f)})(t0)}
var tt;function toast(t,ms){var e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("on")},ms||1800)}
function load(){try{data=JSON.parse(ls(KEY)||"[]")}catch(e){data=[]}}
function save(){lset(KEY,JSON.stringify(data))}

function render(){
  var inc=0,exp=0,by={};
  data.forEach(function(x){var m=x.date.slice(0,7);by[m]=by[m]||{i:0,e:0};if(x.type=="inc"){inc+=x.amt;by[m].i+=x.amt}else{exp+=x.amt;by[m].e+=x.amt}});
  var cur=by[sel]||{i:0,e:0};
  anim($("bal"),inc-exp);anim($("tinc"),inc);anim($("texp"),exp);
  var pc=inc>0?Math.min(100,exp/inc*100):0;setTimeout(function(){$("pbf").style.width=pc+"%"},80);
  $("pt").textContent=inc>0?G(28).replace("%d",Math.round(exp/inc*100)):G(29);
  $("mlabel").textContent=mlab(sel);
  $("mi").textContent=fmt(cur.i);$("me").textContent=fmt(cur.e);
  var sv=cur.i-cur.e;$("ms").textContent=fmt(sv);$("ms").className=sv<0?"neg":"pos";
  // bars
  var ks=Object.keys(by).concat([sel,today().slice(0,7)]).sort(),ms=[],mm=ks[0];while(mm<=ks[ks.length-1]){ms.push(mm);mm=shift(mm,1)}
  var mx=1;ms.forEach(function(m){var v=by[m]||{i:0,e:0};mx=Math.max(mx,v.i,v.e)});
  $("bars").innerHTML=ms.map(function(m){var v=by[m]||{i:0,e:0};
    return '<div class="col'+(m==sel?" sel":"")+'" data-m="'+m+'"><div class="pair"><i class="b g" data-h="'+(v.i/mx*128)+'"></i><i class="b r" data-h="'+(v.e/mx*128)+'"></i></div><span>'+mlab(m,1)+' \''+m.slice(2,4)+'</span></div>'}).join("");
  Array.prototype.forEach.call($("bars").children,function(c){c.onclick=function(){sel=c.getAttribute("data-m");render()}});
  var sc=$("bars").querySelector(".sel");if(sc)$("bars").scrollLeft=sc.offsetLeft-$("bars").clientWidth/2+sc.clientWidth/2;
  setTimeout(function(){Array.prototype.forEach.call(document.querySelectorAll(".b"),function(b){b.style.height=Math.max(3,+b.getAttribute("data-h"))+"px"})},40);
  // donut
  var cats={};data.forEach(function(x){if(x.type=="exp"&&x.date.slice(0,7)==sel)cats[x.cat]=(cats[x.cat]||0)+x.amt});
  var ck=Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}),tot=cur.e,acc=0;
  if(!ck.length){$("donut").innerHTML='<div class="empty"><span>🌱</span>'+G(30).replace("%m",mlab(sel))+'</div>'}
  else{
    var cs=ck.map(function(c,i){var p=cats[c]/tot*100,s='<circle r="15.9155" cx="21" cy="21" fill="none" stroke="'+COL[i%COL.length]+'" stroke-width="5" stroke-dasharray="0 100" stroke-dashoffset="'+(-acc)+'" data-d="'+p+' '+(100-p)+'"/>';acc+=p;return s}).join("");
    var lg=ck.map(function(c,i){return '<div><span><i style="background:'+COL[i%COL.length]+'"></i>'+(EXPC[c]||"📌")+' '+esc(CN(c))+'</span><b>'+fmt(cats[c])+' · '+Math.round(cats[c]/tot*100)+'%</b></div>'}).join("");
